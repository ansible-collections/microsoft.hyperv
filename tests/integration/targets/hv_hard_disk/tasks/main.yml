---
- name: Define test VM and disk names
  set_fact:
    test_vm_name: "AnsibleTestDisk_{{ 99999 | random }}"
    test_vhd_path: "C:\\AnsibleTestDisk_{{ 99999 | random }}.vhdx"

- block:
    - name: Setup - Create a temporary dummy VM for testing
      microsoft.hyperv.hv_vm:
        name: "{{ test_vm_name }}"
        state: present
        generation: 2
        memory_startup_bytes: "256MB"

    - name: Setup - Create a temporary VHDX for testing (Check Mode)
      microsoft.hyperv.hv_vhd:
        path: "{{ test_vhd_path }}"
        state: present
        size_bytes: "1GB"
        vhd_type: Dynamic
      check_mode: true
      register: vhd_setup_check

    - name: Assert VHDX setup check mode
      assert:
        that:
          - vhd_setup_check.changed == true

    - name: Setup - Create a temporary VHDX for testing
      microsoft.hyperv.hv_vhd:
        path: "{{ test_vhd_path }}"
        state: present
        size_bytes: "1GB"
        vhd_type: Dynamic

    - name: Setup - Idempotency check for VHDX creation
      microsoft.hyperv.hv_vhd:
        path: "{{ test_vhd_path }}"
        state: present
        size_bytes: "1GB"
        vhd_type: Dynamic
      register: vhd_setup_idem

    - name: Assert VHDX setup idempotency
      assert:
        that:
          - vhd_setup_idem.changed == false

    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove temporary dummy VM
      microsoft.hyperv.hv_vm:
        name: "{{ test_vm_name }}"
        state: absent
      ignore_errors: true

    - name: Teardown - Remove temporary VHDX
      microsoft.hyperv.hv_vhd:
        path: "{{ test_vhd_path }}"
        state: absent
      ignore_errors: true
