---
- name: Test - Create VM Collection Group (Check Mode)
  microsoft.hyperv.hv_vm_group:
    name: "{{ test_group_name_collection }}"
    group_type: VMCollectionType
    vm_members:
      - "{{ test_vm_name_1 }}"
  check_mode: true
  register: group_create_check

- name: Assert Create Check Mode
  assert:
    that:
      - group_create_check.changed == true
      - group_create_check.name == test_group_name_collection

- name: Test - Create VM Collection Group
  microsoft.hyperv.hv_vm_group:
    name: "{{ test_group_name_collection }}"
    group_type: VMCollectionType
    vm_members:
      - "{{ test_vm_name_1 }}"
  register: group_create_actual

- name: Assert Create Actual
  assert:
    that:
      - group_create_actual.changed == true
      - test_vm_name_1 in group_create_actual.vm_members

- name: Test - Idempotency Add Member
  microsoft.hyperv.hv_vm_group:
    name: "{{ test_group_name_collection }}"
    group_type: VMCollectionType
    vm_members:
      - "{{ test_vm_name_1 }}"
  register: group_create_idem

- name: Assert Idempotency
  assert:
    that:
      - group_create_idem.changed == false

- name: Test - Update VM Members (Check Mode)
  microsoft.hyperv.hv_vm_group:
    name: "{{ test_group_name_collection }}"
    group_type: VMCollectionType
    vm_members:
      - "{{ test_vm_name_2 }}"
  check_mode: true
  register: group_update_check

- name: Assert Update Check Mode
  assert:
    that:
      - group_update_check.changed == true
      - test_vm_name_2 in group_update_check.vm_members
      - test_vm_name_1 not in group_update_check.vm_members

- name: Test - Update VM Members (Add/Remove)
  microsoft.hyperv.hv_vm_group:
    name: "{{ test_group_name_collection }}"
    group_type: VMCollectionType
    vm_members:
      - "{{ test_vm_name_2 }}"
  register: group_update_actual

- name: Assert Update Actual
  assert:
    that:
      - group_update_actual.changed == true
      - test_vm_name_2 in group_update_actual.vm_members
      - test_vm_name_1 not in group_update_actual.vm_members

- name: Test - Clear all VM members
  microsoft.hyperv.hv_vm_group:
    name: "{{ test_group_name_collection }}"
    group_type: VMCollectionType
    vm_members: []
  register: group_clear_actual

- name: Assert Clear Members
  assert:
    that:
      - group_clear_actual.changed == true
      - group_clear_actual.vm_members is none or group_clear_actual.vm_members | length == 0

- name: Test - Create Management Group (Nested)
  microsoft.hyperv.hv_vm_group:
    name: "{{ test_group_name_mgmt }}"
    group_type: ManagementCollectionType
    group_members:
      - "{{ test_group_name_collection }}"
  register: mgmt_group_actual

- name: Assert Management Group
  assert:
    that:
      - mgmt_group_actual.changed == true
      - test_group_name_collection in mgmt_group_actual.group_members

- name: Test - Idempotency Management Group
  microsoft.hyperv.hv_vm_group:
    name: "{{ test_group_name_mgmt }}"
    group_type: ManagementCollectionType
    group_members:
      - "{{ test_group_name_collection }}"
  register: mgmt_group_idem

- name: Assert Idempotency Management Group
  assert:
    that:
      - mgmt_group_idem.changed == false

- name: Test - Remove Group
  microsoft.hyperv.hv_vm_group:
    name: "{{ test_group_name_mgmt }}"
    state: absent
  register: mgmt_group_remove

- name: Assert Remove
  assert:
    that:
      - mgmt_group_remove.changed == true
