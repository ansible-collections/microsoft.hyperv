---
- name: Define test VM name
  set_fact:
    test_vm_passthrough: "AnsibleTestVM_PT_{{ 99999 | random }}"

- block:
    - name: Setup - Create VM
      microsoft.hyperv.hv_vm:
        name: "{{ test_vm_passthrough }}"
        state: present
        generation: 2

    - name: Run hv_hardware_passthrough tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove test VM
      microsoft.hyperv.hv_vm:
        name: "{{ test_vm_passthrough }}"
        state: absent
      ignore_errors: true
