---
- name: Setup - Create a temporary dummy VM for testing
  microsoft.hyperv.hv_vm:
    name: AnsibleTestVM_Info
    state: present
    generation: 2
    memory_startup_bytes: "512MB"
  register: setup_vm

- block:
    - name: Test gather all VMs (Should include the one we just created)
      microsoft.hyperv.hv_vm_info:
      register: all_vms
    - name: Assert all_vms returns a list and changed is false
      assert:
        that:
          - all_vms.changed == false
          - all_vms.vms is defined
          - all_vms.vms | type_debug == "list"
          - (all_vms.vms | selectattr('name', 'equalto', 'AnsibleTestVM_Info') | list | length) > 0

    - name: Test gather specific VM
      microsoft.hyperv.hv_vm_info:
        name: AnsibleTestVM_Info
      register: single_vm
    - name: Debug - Print specific VM information
      debug:
        msg:
          - "Name: {{ single_vm.vms[0].name }}"
          - "State: {{ single_vm.vms[0].state }}"
          - "Status: {{ single_vm.vms[0].status }}"
          - "Generation: {{ single_vm.vms[0].generation }}"
          - "Memory (Startup): {{ single_vm.vms[0].MemoryStartup }}"
          - "Processor Count: {{ single_vm.vms[0].ProcessorCount }}"

    - name: Assert single_vm returns exactly one VM and matches expected data
      assert:
        that:
          - single_vm.changed == false
          - single_vm.vms | length == 1
          - single_vm.vms[0].name == 'AnsibleTestVM_Info'
          - single_vm.vms[0].generation == 2
          - single_vm.vms[0].state == 'Off'

    - name: Test check_mode for specific VM
      microsoft.hyperv.hv_vm_info:
        name: AnsibleTestVM_Info
      check_mode: true
      register: check_vm
    - name: Assert check_mode returns same data
      assert:
        that:
          - check_vm.changed == false
          - check_vm.vms | length == 1

    - name: Test gather non-existent VM
      microsoft.hyperv.hv_vm_info:
        name: DoesNotExist999
      register: none_vm
    - name: Assert non-existent VM returns empty list
      assert:
        that:
          - none_vm.changed == false
          - none_vm.vms | length == 0

  always:
    - name: Teardown - Remove temporary dummy VM
      microsoft.hyperv.hv_vm:
        name: AnsibleTestVM_Info
        state: absent
      ignore_errors: true
