---
- name: Setup - Ensure RSAT-Clustering is present (Test Host 1)
  ansible.windows.win_powershell:
    script: |
      if (-not (Get-WindowsFeature -Name RSAT-Clustering-PowerShell).Installed) {
          Install-WindowsFeature -Name RSAT-Clustering-PowerShell -IncludeManagementTools | Out-Null
      }
  when: inventory_hostname == 'hyperv_test_host'

- name: Setup - Create Fresh Single-Node Cluster (Test Host 1)
  ansible.windows.win_powershell:
    script: |
      if (-not (Get-Cluster -ErrorAction SilentlyContinue)) {
          New-Cluster -Name "AnsibleTestClus" -Node $env:COMPUTERNAME -NoStorage -AdministrativeAccessPoint DNS -Force | Out-Null
      }
  when: inventory_hostname == 'hyperv_test_host'

- name: Define test set name
  set_fact:
    test_set_name: "AnsibleTestSet_{{ 99999 | random }}"

- block:
    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove dummy Cluster Group
      ansible.windows.win_powershell:
        script: |
          Remove-ClusterGroup -Name "{{ test_dummy_group }}" -RemoveResources -Force -ErrorAction SilentlyContinue
      when: test_dummy_group is defined and inventory_hostname == 'hyperv_test_host'
      ignore_errors: true

    - name: Teardown - Remove Cluster (Leave Clean Env)
      ansible.windows.win_powershell:
        script: |
          if (Get-Cluster -ErrorAction SilentlyContinue) {
              Get-ClusterGroup | Where-Object { $_.IsCoreGroup -eq $false } | Remove-ClusterGroup -RemoveResources -Force -ErrorAction SilentlyContinue
              Remove-Cluster -Force | Out-Null
          }
      when: inventory_hostname == 'hyperv_test_host'
      ignore_errors: true
