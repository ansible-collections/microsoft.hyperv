---
- name: Test - Failure handling on standalone node
  microsoft.hyperv.hv_cluster_group_set:
    name: "{{ test_set_name }}_fail"
    state: present
  register: create_fail
  ignore_errors: true
  when: inventory_hostname == 'hyperv_test_host_2'

- name: Assert failure on standalone node
  assert:
    that:
      - create_fail.failed == true
      - "'Failover Clustering module is not available' in create_fail.msg or 'not a member of an active Failover Cluster' in create_fail.msg"
  when: inventory_hostname == 'hyperv_test_host_2'

- name: Setup - Create a dummy Cluster Group for testing
  ansible.windows.win_powershell:
    script: |
      $groupName = "AnsibleTestGroup_{{ 99999 | random }}"
      if (-not (Get-ClusterGroup -Name $groupName -ErrorAction SilentlyContinue)) {
          Add-ClusterGroup -Name $groupName | Out-Null
      }
      $Ansible.Result.group_name = $groupName
  register: cluster_group_setup
  when: inventory_hostname == 'hyperv_test_host'

- name: Set dummy group fact
  set_fact:
    test_dummy_group: "{{ cluster_group_setup.result.group_name }}"
  when: inventory_hostname == 'hyperv_test_host'

- name: Test - Create Cluster Group Set (Check Mode)
  microsoft.hyperv.hv_cluster_group_set:
    name: "{{ test_set_name }}"
    state: present
  check_mode: true
  register: set_create_check
  when: inventory_hostname == 'hyperv_test_host'

- name: Assert Create Check Mode
  assert:
    that:
      - set_create_check.changed == true
      - set_create_check.name == test_set_name
  when: inventory_hostname == 'hyperv_test_host'

- name: Test - Create Cluster Group Set
  microsoft.hyperv.hv_cluster_group_set:
    name: "{{ test_set_name }}"
    state: present
  register: set_create_actual
  when: inventory_hostname == 'hyperv_test_host'

- name: Assert Create Actual
  assert:
    that:
      - set_create_actual.changed == true
      - set_create_actual.name == test_set_name
  when: inventory_hostname == 'hyperv_test_host'

- name: Test - Add Group Member to Set
  microsoft.hyperv.hv_cluster_group_set:
    name: "{{ test_set_name }}"
    groups:
      - "{{ test_dummy_group }}"
  register: set_add_member
  when: inventory_hostname == 'hyperv_test_host'

- name: Assert Add Member
  assert:
    that:
      - set_add_member.changed == true
      - test_dummy_group in set_add_member.groups
  when: inventory_hostname == 'hyperv_test_host'

- name: Test - Idempotency Add Member
  microsoft.hyperv.hv_cluster_group_set:
    name: "{{ test_set_name }}"
    groups:
      - "{{ test_dummy_group }}"
  register: set_add_idem
  when: inventory_hostname == 'hyperv_test_host'

- name: Assert Idempotency
  assert:
    that:
      - set_add_idem.changed == false
  when: inventory_hostname == 'hyperv_test_host'

- name: Test - Remove Cluster Group Set
  microsoft.hyperv.hv_cluster_group_set:
    name: "{{ test_set_name }}"
    state: absent
  register: set_remove_actual
  when: inventory_hostname == 'hyperv_test_host'
  ignore_errors: true

- name: Assert Remove
  assert:
    that:
      - set_remove_actual.changed == true or set_remove_actual.failed == true
  when: inventory_hostname == 'hyperv_test_host'
