---
# Testing security settings is highly dependent on host HGS/TPM configuration.
# We'll focus on parameter validation and the module's ability to handle
# missing VMs or incorrect states.

- name: Test - Validation (Missing VM)
  microsoft.hyperv.hv_shielded_vm:
    vm_name: "NonExistentVM_{{ 99999 | random }}"
    state: enabled
  register: val_fail
  ignore_errors: true

- name: Assert Validation Failure (Missing VM)
  assert:
    that:
      - val_fail.failed == true
      - "'not found' in val_fail.msg"

- name: Setup - Start VM
  microsoft.hyperv.hv_vm_state:
    name: "{{ test_vm_shielded }}"
    state: running

- name: Test - Failure (Running VM)
  microsoft.hyperv.hv_shielded_vm:
    vm_name: "{{ test_vm_shielded }}"
    encryption_state: encrypted
  register: run_fail
  ignore_errors: true

- name: Assert Failure (Running VM)
  assert:
    that:
      - run_fail.failed == true
      - " 'must be in the ' in run_fail.msg "
      - " 'Off' in run_fail.msg "
