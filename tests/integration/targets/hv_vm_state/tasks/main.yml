---
- name: Setup - Create a temporary dummy VM for testing
  microsoft.hyperv.hv_vm:
    name: AnsibleTestVM_State
    state: present
    generation: 2
    memory_startup_bytes: "256MB"
  register: setup_vm

- block:
    - name: Test error handling - action on non-existent VM
      microsoft.hyperv.hv_vm_state:
        name: DoesNotExist999
        state: running
      register: none_vm
      ignore_errors: true

    - name: Assert non-existent VM returns failure
      assert:
        that:
          - none_vm.failed == true
          - "'not found' in none_vm.msg"

    - name: Test start VM (initial change)
      microsoft.hyperv.hv_vm_state:
        name: AnsibleTestVM_State
        state: running
      register: start_vm
    - name: Assert start VM was successful
      assert:
        that:
          - start_vm.changed == true
          - start_vm.state == 'Running'

    - name: Test start VM (idempotency)
      microsoft.hyperv.hv_vm_state:
        name: AnsibleTestVM_State
        state: running
      register: start_vm_idem
    - name: Assert start VM is idempotent
      assert:
        that:
          - start_vm_idem.changed == false
          - start_vm_idem.state == 'Running'

    - name: Test pause VM
      microsoft.hyperv.hv_vm_state:
        name: AnsibleTestVM_State
        state: paused
      register: pause_vm
    - name: Assert pause VM was successful
      assert:
        that:
          - pause_vm.changed == true
          - pause_vm.state == 'Paused'

    - name: Test start VM from paused
      microsoft.hyperv.hv_vm_state:
        name: AnsibleTestVM_State
        state: running
      register: start_from_paused
    - name: Assert start from paused was successful
      assert:
        that:
          - start_from_paused.changed == true
          - start_from_paused.state == 'Running'

    - name: Test stop VM in check_mode
      microsoft.hyperv.hv_vm_state:
        name: AnsibleTestVM_State
        state: stopped
      check_mode: true
      register: check_stop_vm
    - name: Assert check_mode reports changed and expected state
      assert:
        that:
          - check_stop_vm.changed == true
          - check_stop_vm.state == 'Off'

    - name: Test save VM
      microsoft.hyperv.hv_vm_state:
        name: AnsibleTestVM_State
        state: saved
      register: save_vm
    - name: Assert save VM was successful
      assert:
        that:
          - save_vm.changed == true
          - save_vm.state == 'Saved'

    - name: Test start VM from saved
      microsoft.hyperv.hv_vm_state:
        name: AnsibleTestVM_State
        state: running
      register: start_from_saved
    - name: Assert start from saved was successful
      assert:
        that:
          - start_from_saved.changed == true
          - start_from_saved.state == 'Running'

    - name: Gather info before restart
      microsoft.hyperv.hv_vm_info:
        name: AnsibleTestVM_State
      register: pre_restart_info
    - name: Test restart VM
      microsoft.hyperv.hv_vm_state:
        name: AnsibleTestVM_State
        state: restarted
        force: true
      register: restart_vm
    - name: Gather info after restart
      microsoft.hyperv.hv_vm_info:
        name: AnsibleTestVM_State
      register: post_restart_info
    - name: Debug - VM status after restart
      debug:
        msg:
          - "Name: {{ post_restart_info.vms[0].name }}"
          - "State: {{ post_restart_info.vms[0].state }}"
          - "Status: {{ post_restart_info.vms[0].status }}"
          - "Uptime Before Restart (Seconds): {{ pre_restart_info.vms[0].uptime_seconds }}"
          - "Uptime After Restart (Seconds): {{ post_restart_info.vms[0].uptime_seconds }}"

    - name: Assert restart VM was successful
      assert:
        that:
          - restart_vm.changed == true
          - restart_vm.state == 'Running'

    - name: Test stop VM
      microsoft.hyperv.hv_vm_state:
        name: AnsibleTestVM_State
        state: stopped
        force: true
      register: stop_vm
    - name: Assert stop VM was successful
      assert:
        that:
          - stop_vm.changed == true
          - stop_vm.state == 'Off'

    - name: Test stop VM (idempotency)
      microsoft.hyperv.hv_vm_state:
        name: AnsibleTestVM_State
        state: stopped
      register: stop_vm_idem
    - name: Assert stop VM is idempotent
      assert:
        that:
          - stop_vm_idem.changed == false
          - stop_vm_idem.state == 'Off'

  always:
    - name: Teardown - Remove temporary dummy VM
      microsoft.hyperv.hv_vm:
        name: AnsibleTestVM_State
        state: absent
      ignore_errors: true
