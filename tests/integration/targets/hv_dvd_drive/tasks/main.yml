---
- name: Define test VM and ISO names
  set_fact:
    test_vm_name: "AnsibleTestDVD_{{ 99999 | random }}"
    test_iso_path: "C:\\AnsibleTestISO_{{ 99999 | random }}.iso"

- block:
    - name: Setup - Create a temporary dummy VM for testing
      microsoft.hyperv.hv_vm:
        name: "{{ test_vm_name }}"
        state: present
        generation: 2
        memory_startup_bytes: "256MB"

    - name: Setup - Create a dummy ISO file for testing
      ansible.windows.win_file:
        path: "{{ test_iso_path }}"
        state: touch

    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove temporary dummy VM
      microsoft.hyperv.hv_vm:
        name: "{{ test_vm_name }}"
        state: absent
      ignore_errors: true

    - name: Teardown - Remove temporary ISO
      ansible.windows.win_file:
        path: "{{ test_iso_path }}"
        state: absent
      ignore_errors: true
