---
- name: Define test VM and path
  set_fact:
    test_vm_move: "AnsibleMove_{{ 99999 | random }}"
    test_move_path: "C:\\AnsibleMoveDest_{{ 99999 | random }}"

- block:
    - name: Setup - Create a temporary dummy VM for testing
      microsoft.hyperv.hv_vm:
        name: "{{ test_vm_move }}"
        state: present
        generation: 2
        memory_startup_bytes: "256MB"

    - name: Run tests
      ansible.builtin.include_tasks: tests.yml

  always:
    - name: Teardown - Remove VM
      microsoft.hyperv.hv_vm:
        name: "{{ test_vm_move }}"
        state: absent
      ignore_errors: true

    - name: Teardown - Remove destination directory
      ansible.windows.win_file:
        path: "{{ test_move_path }}"
        state: absent
      ignore_errors: true
