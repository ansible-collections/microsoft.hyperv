---
# Testing PowerShell Direct requires the VM to be fully booted with Integration Services responding.
# Since our CI environment creates empty, unformatted test VMs, we cannot establish a PSSession 
# with valid guest credentials. We will test the robust failure and validation paths.

- name: Test - Validation (Missing Script)
  microsoft.hyperv.hv_guest:
    vm_name: "{{ test_vm_direct }}"
    action: run
    guest_credential:
      username: admin
      password: password
  register: val_script
  ignore_errors: true

- name: Assert Missing Script
  assert:
    that:
      - val_script.failed == true
      - "('script\\' parameter is required' in val_script.msg)"

- name: Test - Validation (Missing Copy Paths)
  microsoft.hyperv.hv_guest:
    vm_name: "{{ test_vm_direct }}"
    action: copy_in
    guest_credential:
      username: admin
      password: password
  register: val_copy
  ignore_errors: true

- name: Assert Missing Copy Paths
  assert:
    that:
      - val_copy.failed == true
      - "('src\\' and \\'dest\\' parameters are required' in val_copy.msg)"

- name: Test - Validation (Missing Source Host File)
  microsoft.hyperv.hv_guest:
    vm_name: "{{ test_vm_direct }}"
    action: copy_in
    src: "C:\\DoesNot\\Exist.txt"
    dest: "C:\\InGuest.txt"
    guest_credential:
      username: admin
      password: password
  register: val_src
  ignore_errors: true

- name: Assert Missing Host File
  assert:
    that:
      - val_src.failed == true
      - "('does not exist on the Hyper-V host' in val_src.msg)"

- name: Test - Execution Failure (VM not booted/No OS)
  microsoft.hyperv.hv_guest:
    vm_name: "{{ test_vm_direct }}"
    action: run
    script: "Get-Process"
    guest_credential:
      username: admin
      password: password
  register: exec_fail
  ignore_errors: true

- name: Assert Execution Failure (VMBus timeout/No OS)
  assert:
    that:
      - exec_fail.failed == true
      - "'PowerShell Direct VMBus connection failed' in exec_fail.msg"
