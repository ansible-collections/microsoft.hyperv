---
# 1. Generation 1 Tests
- name: Test Gen1 - Set StartupOrder
  microsoft.hyperv.hv_vm_boot:
    name: "{{ test_gen1 }}"
    startup_order:
      - IDE
      - CD
  register: boot_gen1_order

- name: Assert Gen1 modifications
  assert:
    that:
      - boot_gen1_order.changed == true
      - boot_gen1_order.startup_order[0] == "IDE"
      - boot_gen1_order.startup_order[1] == "CD"

- name: Test Gen1 - Idempotency
  microsoft.hyperv.hv_vm_boot:
    name: "{{ test_gen1 }}"
    startup_order:
      - IDE
      - CD
  register: boot_gen1_idem

- name: Assert Gen1 Idempotency
  assert:
    that:
      - boot_gen1_idem.changed == false

# 2. Generation 2 Tests
- name: Test Gen2 - Set SecureBoot
  microsoft.hyperv.hv_vm_boot:
    name: "{{ test_gen2 }}"
    secure_boot: true
    secure_boot_template: MicrosoftUEFICertificateAuthority
  register: boot_gen2_sb

- name: Assert Gen2 SecureBoot
  assert:
    that:
      - boot_gen2_sb.changed == true
      - boot_gen2_sb.secure_boot == true

- name: Test Gen2 - Set BootOrder (Check Mode)
  microsoft.hyperv.hv_vm_boot:
    name: "{{ test_gen2 }}"
    boot_order:
      - SCSI
      - Network
      - DVD
  check_mode: true
  register: boot_gen2_order_check

- name: Assert Gen2 BootOrder Check Mode
  assert:
    that:
      - boot_gen2_order_check.changed == true
      - boot_gen2_order_check.boot_order[0] == "SCSI"

- name: Test Gen2 - Set BootOrder
  microsoft.hyperv.hv_vm_boot:
    name: "{{ test_gen2 }}"
    boot_order:
      - SCSI
      - Network
      - DVD
  register: boot_gen2_order

- name: Assert Gen2 BootOrder
  assert:
    that:
      - boot_gen2_order.changed == true
      - boot_gen2_order.boot_order[0] == "SCSI"

- name: Test Gen2 - Set BootOrder (Drop unlisted items)
  microsoft.hyperv.hv_vm_boot:
    name: "{{ test_gen2 }}"
    boot_order:
      - SCSI
  register: boot_gen2_order_drop

- name: Assert Gen2 BootOrder Drop
  assert:
    that:
      - boot_gen2_order_drop.changed == true
      - boot_gen2_order_drop.boot_order[0] == "SCSI"
      - "'Network' not in boot_gen2_order_drop.boot_order"
      - "'DVD' not in boot_gen2_order_drop.boot_order"

# 3. Targeted SCSI Validation (Issue #40)
- name: Define Dummy Disk Paths
  set_fact:
    os_disk_path: "C:\\Users\\Public\\Documents\\test_os_scsi_{{ 99999 | random }}.vhdx"
    dummy_disk_path: "C:\\Users\\Public\\Documents\\test_dummy_scsi_{{ 99999 | random }}.vhdx"

- name: Setup - Create actual VHDX files on disk
  ansible.windows.win_shell: |
    New-VHD -Path '{{ os_disk_path }}' -SizeBytes 1GB -Dynamic | Out-Null
    New-VHD -Path '{{ dummy_disk_path }}' -SizeBytes 1GB -Dynamic | Out-Null
  
- name: Setup - Add OS SCSI drive
  microsoft.hyperv.hv_hard_disk:
    vm_name: "{{ test_gen2 }}"
    controller_type: SCSI
    controller_number: 0
    controller_location: 1
    path: "{{ os_disk_path }}"
    state: present

- name: Setup - Add secondary dummy SCSI drive for targeted testing
  microsoft.hyperv.hv_hard_disk:
    vm_name: "{{ test_gen2 }}"
    controller_type: SCSI
    controller_number: 0
    controller_location: 2
    path: "{{ dummy_disk_path }}"
    state: present
  register: setup_dummy_disk

- name: Test Gen2 - Set Targeted SCSI BootOrder
  microsoft.hyperv.hv_vm_boot:
    name: "{{ test_gen2 }}"
    boot_order:
      - "SCSI:0:1"
  register: boot_gen2_scsi_target

- name: Assert Targeted SCSI BootOrder
  assert:
    that:
      - boot_gen2_scsi_target.changed == true
      - "'SCSI:0:1' in boot_gen2_scsi_target.boot_order"
      - "'SCSI:0:2' not in boot_gen2_scsi_target.boot_order"

- name: Test Gen2 - Targeted SCSI Idempotency
  microsoft.hyperv.hv_vm_boot:
    name: "{{ test_gen2 }}"
    boot_order:
      - "SCSI:0:1"
  register: boot_gen2_scsi_idem

- name: Assert Targeted SCSI Idempotency
  assert:
    that:
      - boot_gen2_scsi_idem.changed == false

- name: Teardown - Remove OS SCSI drive from VM
  microsoft.hyperv.hv_hard_disk:
    vm_name: "{{ test_gen2 }}"
    controller_type: SCSI
    controller_number: 0
    controller_location: 1
    state: absent
  ignore_errors: true

- name: Teardown - Remove secondary dummy SCSI drive from VM
  microsoft.hyperv.hv_hard_disk:
    vm_name: "{{ test_gen2 }}"
    controller_type: SCSI
    controller_number: 0
    controller_location: 2
    state: absent
  ignore_errors: true

- name: Teardown - Delete physical VHDX files
  ansible.windows.win_file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ os_disk_path }}"
    - "{{ dummy_disk_path }}"
  ignore_errors: true
