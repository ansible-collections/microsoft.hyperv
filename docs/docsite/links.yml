---
# This ensures that plugin and module documentation gets "Edit on GitHub" links.
edit_on_github:
  repository: ansible-collections/microsoft.hyperv
  branch: main
  path_prefix: ''

# Extra links displayed on the docsite buttons.
extra_links:
  - description: Report an issue
    url: https://github.com/ansible-collections/microsoft.hyperv/issues

# Standard communication channels for the collection.
communication:
  matrix_rooms:
    - topic: General usage and support questions
      room: '#hyperv:ansible.im'
  forums:
    - topic: Ansible Forum (Hyper-V tag)
      url: https://forum.ansible.com/tag/hyperv
