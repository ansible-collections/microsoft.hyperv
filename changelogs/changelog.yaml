---
ancestor: null
releases:
  1.0.0:
    changes:
      minor_changes:
        - Align collection structure with standard Ansible conventions for modules
          and tests.
        - Implement foundational module_utils (`hyperv_connection`, `hyperv_core`,
          `hyperv_powershell`) for remote Hyper-V management via PSRP.
        - hv_checkpoint - Manage Hyper-V Virtual Machine Checkpoints (Snapshots).
        - hv_dvd_drive - Manage virtual DVD drives and ISO mounting for Hyper-V Virtual
          Machines.
        - hv_hard_disk - Manage Hyper-V Virtual Machine Hard Disk Drives.
        - hv_host - Manage global host-level settings for the Hyper-V hypervisor.
        - hv_host_info - Gather facts about the Hyper-V host.
        - hv_memory - Manage Hyper-V Virtual Machine Memory Settings.
        - hv_network_adapter - Manage Hyper-V Virtual Machine Network Adapters.
        - hv_processor - Manage Hyper-V Virtual Machine Processors (vCPU).
        - hv_scsi_controller - Manage the number of synthetic SCSI controllers attached
          to a Hyper-V Virtual Machine.
        - hv_storage_pool - Manage Hyper-V Storage Resource Pools.
        - hv_vhd - Manage Hyper-V Virtual Hard Disk (VHD/VHDX) files.
        - hv_vm - Manage the creation and removal of Virtual Machines on a Hyper-V
          host.
        - hv_vm_boot - Manage boot configuration for Hyper-V Virtual Machines.
        - hv_vm_info - Gather information about Hyper-V Virtual Machines.
        - hv_vm_state - Manage the power state of virtual machines on a Hyper-V host.
    fragments:
      - hv_checkpoint.yaml
      - hv_dvd_drive.yaml
      - hv_hard_disk.yaml
      - hv_host.yaml
      - hv_host_info.yaml
      - hv_memory.yaml
      - hv_network_adapter.yaml
      - hv_processor.yaml
      - hv_scsi_controller.yaml
      - hv_storage_pool.yaml
      - hv_vhd.yaml
      - hv_vm.yaml
      - hv_vm_boot.yaml
      - hv_vm_info.yaml
      - hv_vm_state.yaml
      - phase1-foundation.yaml
    release_date: '2026-03-24'
  1.1.0:
    changes:
      minor_changes:
        - All existing modules - Refactored to utilize the new shared property mapping
          utilities, significantly improving maintainability, type-safety, and code
          consistency.
        - HyperV.psm1 - Introduced a suite of shared PowerShell utility functions
          (`Get-HyperVParametersFromMap`, `Test-HyperVPropertiesChanged`, `Set-HyperVResultFromMap`)
          to standardize parameter building, idempotency checks, and result population
          across the collection.
        - hv_cluster_group_set - Manage Hyper-V Cluster Group Sets (Anti-Affinity).
        - hv_cluster_node_maintenance - Manage Hyper-V Cluster Node Maintenance Mode.
        - hv_com_port - Manage Hyper-V Virtual Machine Serial (COM) Ports.
        - hv_guest - Manage Hyper-V Guest OS via PowerShell Direct.
        - hv_guest_command - Execute PowerShell scripts in Hyper-V Guest OS via PowerShell
          Direct.
        - hv_guest_copy - Transfer files to and from Hyper-V Guest OS via PowerShell
          Direct.
        - hv_hardware_passthrough - Manage GPU partitioning (GPU-P) and Discrete Device
          Assignment (DDA).
        - hv_integration_service - Manage Hyper-V Virtual Machine Integration Services.
        - hv_isolation - Manage Hyper-V Network Adapter Isolation (SDN).
        - hv_migration_network - Manage Hyper-V Migration Networks.
        - hv_nested_virt - Enable or disable nested virtualization for Hyper-V VMs.
        - hv_network_acl - Manage Standard and Extended Network Access Control Lists
          (ACLs) on Hyper-V virtual network adapters.
        - hv_replication - Manage Hyper-V Virtual Machine Replication.
        - hv_replication_server - Manage Hyper-V Replica Server Settings.
        - hv_resource_pool - Create and manage resource pools for metering and chargeback.
        - hv_san_adapter - Manage Hyper-V Virtual Fibre Channel HBAs.
        - hv_shielded_vm - Manage security settings and Key Protectors for secure
          VMs.
        - hv_vm_group - Manage Hyper-V Virtual Machine Groups.
        - hv_vm_move - Manage Hyper-V Virtual Machine Live Migration and Storage Migration.
        - hv_vm_tag - Manage Hyper-V Virtual Machine Metadata Tags.
        - hv_vm_transfer - Manage Hyper-V Virtual Machine Export and Import.
        - hv_vswitch - Manage Hyper-V Virtual Switches and extensions.
        - microsoft.hyperv.hv_vm_guest_wait - Wait for VM guest agent and IP addresses
          (including CIDR support) to become available
    fragments:
      - hv_cluster_group_set.yaml
      - hv_cluster_node_maintenance.yaml
      - hv_com_port.yaml
      - hv_guest.yaml
      - hv_guest_command_copy.yaml
      - hv_integration_service.yaml
      - hv_isolation.yaml
      - hv_migration_network.yaml
      - hv_network_acl.yaml
      - hv_replication.yaml
      - hv_replication_server.yaml
      - hv_san_adapter.yaml
      - hv_vm_group.yaml
      - hv_vm_guest_wait.yaml
      - hv_vm_move.yaml
      - hv_vm_tag.yaml
      - hv_vm_transfer.yaml
      - hv_vswitch.yaml
      - phase5_specialized.yaml
      - refactor-configmap-util.yaml
    release_date: '2026-05-19'
